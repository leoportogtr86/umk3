<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMK3 Blog — Comandos Ultimate Mortal Kombat 3 SNES</title>
  <meta name="description" content="Guia completo de comandos do Ultimate Mortal Kombat 3 para Super Nintendo. Golpes especiais, finalizações e combos de todos os personagens.">

  <!-- Preconnect para Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontes pixel art: Press Start 2P (títulos) + VT323 (corpo) -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos customizados complementares -->
  <link rel="stylesheet" href="css/custom.css">

  <!-- Configuração do Tailwind para tema customizado — Arcade Palette -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Fundo principal — preto-azulado profundo (luminosidade ~5% HSL)
            'mk-dark': '#0d0d1a',
            // Fundo de cards/containers — ligeiramente mais claro
            'mk-accent': '#1a1a2e',
            // Fundo secundário para seções
            'mk-secondary': '#16213e',
            // Neon primário — ciano elétrico (saturação 100%, luminosidade 50%)
            'mk-primary': '#00ffff',
            // Neon secundário — magenta (saturação 100%, luminosidade 50%)
            'mk-magenta': '#ff00ff',
            // Neon terciário — amarelo elétrico (saturação 100%, luminosidade 50%)
            'mk-yellow': '#ffff00',
            // Neon quaternário — verde neon (saturação 100%, luminosidade 45%)
            'mk-green': '#00e600',
            // Neon para alertas/finishers — vermelho neon
            'mk-red': '#ff3333',
          },
          fontFamily: {
            'pixel': ['"Press Start 2P"', 'monospace'],
            'mono': ['"VT323"', '"Courier New"', 'Courier', 'monospace'],
          },
          keyframes: {
            'glow-pulse': {
              '0%, 100%': { textShadow: '0 0 4px #00ffff, 0 0 8px #00ffff' },
              '50%': { textShadow: '0 0 8px #00ffff, 0 0 16px #00ffff, 0 0 24px #00ffff' },
            },
            'card-enter': {
              '0%': { opacity: '0', transform: 'scale(0.8)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
          },
          animation: {
            'glow-pulse': 'glow-pulse 2s ease-in-out infinite',
            'card-enter': 'card-enter 300ms ease-out forwards',
          },
        }
      }
    }
  </script>
</head>
<body class="bg-mk-dark text-gray-100 min-h-screen">
  <!-- Link de pular para conteúdo principal (acessibilidade - navegação por teclado) -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-mk-yellow focus:text-mk-dark focus:font-bold focus:rounded focus:outline focus:outline-2 focus:outline-mk-primary">
    Pular para o conteúdo principal
  </a>

  <!-- Container principal da aplicação SPA -->
  <div id="app" role="application" aria-label="UMK3 Blog - Guia de comandos" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Conteúdo renderizado dinamicamente via JavaScript -->
  </div>

  <!-- Módulos JavaScript da aplicação -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
